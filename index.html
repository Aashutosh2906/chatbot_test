<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLM Chatbot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: #fff;
            color: #333;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* SIDEBAR */
        .sidebar {
            width: 260px;
            background: #f7f7f8;
            border-right: 1px solid #d0d0d0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid #e0e0e0;
        }

        .new-chat-btn {
            width: 100%;
            padding: 10px 16px;
            background: #fff;
            border: 1px solid #d0d0d0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .new-chat-btn:hover {
            background: #f0f0f0;
            border-color: #b0b0b0;
        }

        .new-chat-btn::before {
            content: '+';
            font-size: 18px;
        }

        .conversations-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .conversation-item {
            padding: 12px 16px;
            margin-bottom: 8px;
            background: transparent;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 14px;
            color: #333;
            transition: all 0.2s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .conversation-item:hover {
            background: #e8e8e8;
        }

        .conversation-item.active {
            background: #e0e0e0;
            font-weight: 500;
        }

        .conversation-item .delete-btn {
            opacity: 0;
            cursor: pointer;
            background: none;
            border: none;
            color: #666;
            font-size: 16px;
            padding: 4px 8px;
            transition: opacity 0.2s;
        }

        .conversation-item:hover .delete-btn {
            opacity: 1;
        }

        .conversation-item .delete-btn:hover {
            color: #d32f2f;
        }

        /* MAIN CHAT AREA */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #fff;
        }

        .chat-header {
            padding: 16px 24px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state-text {
            font-size: 16px;
            color: #666;
        }

        .message {
            display: flex;
            animation: slideIn 0.3s ease-out;
            max-width: 80%;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message.bot {
            align-self: flex-start;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 600;
            margin: 0 8px;
            flex-shrink: 0;
        }

        .message.user .message-avatar {
            background: #667eea;
            color: white;
        }

        .message.bot .message-avatar {
            background: #e0e0e0;
            color: #333;
        }

        .message-content {
            padding: 12px 16px;
            border-radius: 12px;
            word-wrap: break-word;
            font-size: 15px;
            line-height: 1.5;
        }

        .message.user .message-content {
            background: #667eea;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.bot .message-content {
            background: #f0f0f0;
            color: #333;
            border-bottom-left-radius: 4px;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
            background: #f0f0f0;
            border-radius: 12px;
            width: fit-content;
            border-bottom-left-radius: 4px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #999;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                opacity: 0.3;
                transform: translateY(0);
            }
            30% {
                opacity: 1;
                transform: translateY(-10px);
            }
        }

        /* INPUT AREA */
        .input-area {
            padding: 24px;
            border-top: 1px solid #e0e0e0;
            background: #fff;
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        #messageInput {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #d0d0d0;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
            resize: none;
            max-height: 120px;
            min-height: 44px;
            transition: border-color 0.2s;
        }

        #messageInput:focus {
            outline: none;
            border-color: #667eea;
        }

        .send-btn {
            padding: 10px 20px;
            background: #667eea;
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s;
            height: 44px;
        }

        .send-btn:hover:not(:disabled) {
            background: #5568d3;
        }

        .send-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* SCROLLBAR */
        .messages-container::-webkit-scrollbar,
        .conversations-list::-webkit-scrollbar {
            width: 8px;
        }

        .messages-container::-webkit-scrollbar-track,
        .conversations-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .messages-container::-webkit-scrollbar-thumb,
        .conversations-list::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 4px;
        }

        .messages-container::-webkit-scrollbar-thumb:hover,
        .conversations-list::-webkit-scrollbar-thumb:hover {
            background: #999;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }

            .message {
                max-width: 100%;
            }

            .messages-container {
                padding: 16px;
            }

            .input-area {
                padding: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="sidebar-header">
                <button class="new-chat-btn" onclick="newChat()">New Chat</button>
            </div>
            <div class="conversations-list" id="conversationsList">
                <div style="padding: 16px; color: #999; text-align: center; font-size: 14px;">
                    No conversations yet
                </div>
            </div>
        </div>

        <!-- MAIN CHAT -->
        <div class="main-content">
            <div class="chat-header">
                <div class="chat-title" id="chatTitle">New Chat</div>
            </div>

            <div class="chat-area">
                <div class="messages-container" id="messagesContainer">
                    <div class="empty-state">
                        <div class="empty-state-icon">🤖</div>
                        <div class="empty-state-text">Start a conversation</div>
                    </div>
                </div>

                <div class="input-area">
                    <div class="input-wrapper">
                        <textarea 
                            id="messageInput" 
                            placeholder="Type your message..." 
                            rows="1"
                        ></textarea>
                        <button class="send-btn" id="sendBtn" onclick="sendMessage()">Send</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = window.location.hostname === 'localhost' 
            ? 'http://localhost:5000/api'
            : `${window.location.origin}/api`;
        
        let currentConversationId = null;
        let isSending = false;

        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const messagesContainer = document.getElementById('messagesContainer');
        const conversationsList = document.getElementById('conversationsList');
        const chatTitle = document.getElementById('chatTitle');

        // Initialize
        loadConversations();

        // Auto-resize textarea
        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });

        // Send message on Enter (Shift+Enter for new line)
        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        async function loadConversations() {
            try {
                const response = await fetch(`${API_URL}/conversations`);
                const data = await response.json();
                
                if (data.success && data.conversations.length > 0) {
                    renderConversations(data.conversations);
                    // Load first conversation
                    loadConversation(data.conversations[0].id);
                } else {
                    conversationsList.innerHTML = '<div style="padding: 16px; color: #999; text-align: center; font-size: 14px;">No conversations yet</div>';
                }
            } catch (error) {
                console.error('Error loading conversations:', error);
            }
        }

        function renderConversations(conversations) {
            conversationsList.innerHTML = '';
            conversations.forEach(conv => {
                const item = document.createElement('button');
                item.className = 'conversation-item';
                if (conv.id === currentConversationId) {
                    item.classList.add('active');
                }
                
                const title = document.createElement('span');
                title.textContent = conv.title;
                title.style.flex = '1';
                title.style.overflow = 'hidden';
                title.style.textOverflow = 'ellipsis';
                
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-btn';
                deleteBtn.textContent = '×';
                deleteBtn.onclick = (e) => {
                    e.stopPropagation();
                    deleteConversation(conv.id);
                };
                
                item.appendChild(title);
                item.appendChild(deleteBtn);
                item.onclick = () => loadConversation(conv.id);
                
                conversationsList.appendChild(item);
            });
        }

        async function loadConversation(conversationId) {
            try {
                const response = await fetch(`${API_URL}/conversation/${conversationId}`);
                const data = await response.json();
                
                if (data.success) {
                    currentConversationId = conversationId;
                    const conv = data.conversation;
                    
                    chatTitle.textContent = conv.title;
                    messagesContainer.innerHTML = '';
                    
                    if (conv.messages && conv.messages.length > 0) {
                        conv.messages.forEach(msg => {
                            addMessageToUI(msg.content, msg.role === 'user');
                        });
                    } else {
                        messagesContainer.innerHTML = '<div class="empty-state"><div class="empty-state-icon">💬</div><div class="empty-state-text">Start the conversation</div></div>';
                    }
                    
                    // Update active state in sidebar
                    document.querySelectorAll('.conversation-item').forEach(item => {
                        item.classList.remove('active');
                    });
                    document.querySelectorAll('.conversation-item').forEach(item => {
                        if (item.onclick.toString().includes(conversationId)) {
                            item.classList.add('active');
                        }
                    });
                }
            } catch (error) {
                console.error('Error loading conversation:', error);
            }
        }

        function newChat() {
            currentConversationId = `conv_${Date.now()}`;
            chatTitle.textContent = 'New Chat';
            messagesContainer.innerHTML = '<div class="empty-state"><div class="empty-state-icon">💬</div><div class="empty-state-text">Start the conversation</div></div>';
            messageInput.focus();
        }

        function addMessageToUI(text, isUser) {
            if (messagesContainer.querySelector('.empty-state')) {
                messagesContainer.innerHTML = '';
            }

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'bot'}`;
            
            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = isUser ? 'You' : 'AI';
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = text;
            
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(contentDiv);
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function showTyping() {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message bot';
            messageDiv.id = 'typingIndicator';
            
            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = 'AI';
            
            const typingDiv = document.createElement('div');
            typingDiv.className = 'typing-indicator';
            typingDiv.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
            
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(typingDiv);
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function removeTyping() {
            const typing = document.getElementById('typingIndicator');
            if (typing) {
                typing.remove();
            }
        }

        async function sendMessage() {
            const message = messageInput.value.trim();
            
            if (!message || isSending) {
                return;
            }

            if (!currentConversationId) {
                newChat();
            }

            isSending = true;
            sendBtn.disabled = true;
            messageInput.disabled = true;

            addMessageToUI(message, true);
            messageInput.value = '';
            messageInput.style.height = 'auto';

            showTyping();

            try {
                const response = await fetch(`${API_URL}/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        message: message,
                        conversation_id: currentConversationId
                    })
                });

                const data = await response.json();

                removeTyping();

                if (data.success) {
                    addMessageToUI(data.response, false);
                    // Reload conversations to update the list
                    loadConversations();
                } else {
                    addMessageToUI(`Error: ${data.error}`, false);
                }
            } catch (error) {
                removeTyping();
                addMessageToUI(`Connection error: ${error.message}`, false);
            } finally {
                isSending = false;
                sendBtn.disabled = false;
                messageInput.disabled = false;
                messageInput.focus();
            }
        }

        async function deleteConversation(conversationId) {
            if (!confirm('Delete this conversation?')) {
                return;
            }

            try {
                const response = await fetch(`${API_URL}/conversation/${conversationId}`, {
                    method: 'DELETE'
                });

                const data = await response.json();

                if (data.success) {
                    if (currentConversationId === conversationId) {
                        newChat();
                    }
                    loadConversations();
                }
            } catch (error) {
                console.error('Error deleting conversation:', error);
            }
        }

        messageInput.focus();
    </script>
</body>
</html>
